- id: a_glacier_and_magmer
  title: Glacier & Magmer
  tier: A
  layout: duo
  subtitle: Medium & Large Mix · Cross-Map Cooldown
  badges:
  - text: Mixed
    kind: cat
  - text: Hard
    kind: diff-hard
  cast: Pick up Glacier on the far side of The Empty, then haul it the length of the map to Magmer's lava
    vents in the Labyrinth.
  view_box: 430 0 970 251
  map_caption: The Empty (Glacier) — dashed lure path across the whole map — Labyrinth lava vents (Magmer)
  map_alt: Wide map slice from The Empty across the Silo, Plateau, and Kelp to the Labyrinth, showing
    the cross-map path from Glacier to Magmer
  about: Magmer runs white-hot and melts any line that touches it while unlured. Getting a Glacier anywhere
    near it cools it down long enough to hook — a trick that works whether or not you land the Glacier
    first.
  special_instructions: Equip a huge hook, sinker, Flick, and the Explorer hat if you have it, then find
    a Glacier on the left side of The Empty. Lead or catch it and haul it the entire way over to Magmer's
    cave deep in the Labyrinth, above the lava vents. Bring it within range of Magmer and the heat drops
    enough to hook Magmer safely — pull it away from the vents quickly before it reheats. Only one Glacier
    is needed, and with a huge hook already equipped you can catch Glacier first, Flick it loose onto
    Magmer, then re-catch the freed Glacier and finally hook Magmer, all in one cast.
  shared_gear:
  - icon: 🪝
    text: Huge hook
    required: true
  - icon: ⚓
    text: Sinker
  - icon: 🎣
    text: Flick attachment
  - icon: 📍
    text: Explorer hat (recommended)
