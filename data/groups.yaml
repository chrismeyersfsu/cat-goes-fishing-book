- id: c_noxius
  title: Noxius
  tier: C
  layout: feature
  subtitle: Secret Fish · The Silo
  badges:
  - text: Secret Fish
    kind: cat
  - text: Hard
    kind: diff-hard
  cast: Down through the Silo door to the seabed, just right of the entrance, after clearing every fish
    above it.
  view_box: 620 0 200 251
  map_caption: Clear the water above the Silo, then swim down through the door to the seabed
  map_alt: Map slice of the Silo showing the surface staging area above and the seabed pocket below where
    Noxius bumbles past
  special_instructions: Start by clearing out nearly every fish above the Silo — a trawler net makes this
    fast. Noxius requires level 90 to have the oxygen capacity for the dive; if you're not there yet,
    catching and releasing Josie repeatedly levels you up quickly. Once the area's clear, catch a bulbfish
    and carry it down with you — it helps preserve your oxygen as you descend. Press Q to swim, grab the
    bulbfish from your boat with Ctrl, and tap the down-arrow key rather than holding it, letting momentum
    carry you between taps to conserve air. Take it slow. Once you reach the seabed, Noxius should be
    nearby; if not, wait a moment for it to swim by in a rapid jittering motion. Press Ctrl over it to
    grab it (you may need to lunge), then reascend the same way — tapping the up-arrow and letting momentum
    carry you — before swimming into your boat to let it go into the bed.
  shared_gear:
  - icon: 🥅
    text: Trawler net — to clear the area first
    required: true
  - icon: 🐟
    text: A live bulbfish, carried down for oxygen
    required: true
