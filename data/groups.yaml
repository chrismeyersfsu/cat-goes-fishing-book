  special_instructions: Head out to the Reef Barrier and hold your sonar open until this large purple
    fish slithers into view. It's spooked by any boat movement, so retreat toward shore in the smallest
    increments you can manage — if it darts off-screen, just hold still with sonar open and it drifts
    back. Once you reach shore, unequip your boat entirely (scaring it off from a boat risks it getting
