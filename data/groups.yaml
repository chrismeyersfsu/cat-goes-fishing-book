- id: a_cave_shark_and_bonefish
  title: Cave Shark & Bonefish
  tier: A
  layout: duo
  subtitle: Large Fish · Bomb-Wake Pair
  badges:
  - text: Large Fish
    kind: cat
  - text: Hard
    kind: diff-hard
  cast: Bomb the sleeping pocket in the main caves — both fish wake to the same blast, though only one
    comes quietly.
  view_box: 150 0 220 251
  map_caption: Caves' main pocket — Bonefish bolts toward the Reef once woken
  map_alt: Map slice of the caves showing Cave Shark's side pocket, Bonefish's main pocket, and the path
    Bonefish takes toward the Reef once woken
  about: Cave Shark and Bonefish both sleep in the caves and only wake to the same bomb-and-detonator
    trick — from there they behave completely differently. Cave Shark can be lured out before hooking;
    Bonefish bolts for the Reef the moment it wakes.
  special_instructions: Equip a bomb with the Detonator upgrade, plus Flick and a sinker to make aiming
    easier — the Bomb Stacker upgrade helps too, since cave Bombats love to set your bomb off early. For
    Bonefish, lower the bombed hook onto the sleeping group in the caves' main pocket and detonate; they'll
    scatter off toward the Reef where you can chase them down. Cave Shark sleeps in a side pocket off
    that same area — it's easiest if you lure it out into open water before actually hooking it, since
    fighting it inside the caves is a mess.
  shared_gear:
  - icon: 🪝
    text: Bomb + Detonator upgrade
    required: true
  - icon: ⚓
    text: Sinker
  - icon: 🎣
    text: Flick attachment
  - icon: 📍
    text: Bomb Stacker (recommended, vs. cave Bombats)
  path:
    points:
    - - 215
      - 155
    - - 260
      - 120
    - - 300
      - 90
    start_gap: 8
    end_gap: 8
