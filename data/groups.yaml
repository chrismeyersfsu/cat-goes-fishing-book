- id: a_chompy_and_crayfin
  title: Chompy & Crayfin
  tier: A
  layout: duo
  subtitle: Mixed Size · Trust Pair
  badges:
  - text: Mixed
    kind: cat
  - text: Moderate
    kind: diff-mod
  cast: Work the open water just before the Reef wall — hook Chompy first, then earn Crayfin's trust.
  view_box: 160 0 200 251
  map_caption: Open Ocean, just before the Reef wall
  map_alt: Map slice of the open water before the Reef wall showing Chompy and its trailing Crayfin
  about: Crayfin follows its Chompy everywhere and won't trust your bait while they're together. Hook
    the Chompy but let it go instead of boating it, and Crayfin will finally let you catch it too.
  special_instructions: Get a large bait on a huge hook and catch the Chompy like any other large fish
    — but release it back into the water instead of putting it in your boat. This earns Crayfin's trust,
    and it can now be caught easily with medium bait as long as it isn't right next to its Chompy (which
    will otherwise snap your line). Afterward, catch the Chompy again normally.
  shared_gear:
  - icon: 🪱
    text: Large bait, then medium bait
    required: true
  - icon: 🪝
    text: Huge hook
    required: true
