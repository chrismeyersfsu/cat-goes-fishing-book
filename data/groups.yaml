# The book's groups. Phase 1 seeded 5 demo groups by hand for
# parity with reference/design_preview.html; the rest (Phase 3) were
# authored against reference/fish_grouping_scheme.md and
# reference/guide_text.txt. Coordinates are provisional pending
# re-verification against the actual game, same as PLAN.md always
# expected for a first content pass.
- id: a_trick_and_treat
  title: Trick & Treat
  tier: A
  layout: duo
  subtitle: Large Fish · Halloween Pair
  badges:
  - text: Large Fish
    kind: cat
  - text: Hard
    kind: diff-hard
  cast: Hook Trick above the Reef wall on Halloween night, then lead it across to the surface above the
    Silo.
  view_box: 365 0 380 251
  map_caption: Reef wall (Trick) — dashed lure path — Above Silo (Treat)
  map_alt: Map slice showing the path from the Reef wall (Trick) across to above the Silo (Treat)
  about: Trick only appears on Halloween night — set your clock to 12:00 AM, October 31st, and watch for
    the "Happy Halloween!" prompt. Treat doesn't exist at all until you personally deliver Trick to the
    right patch of water above the Silo.
  special_instructions: Catch Trick with medium bait, but don't bank it yet. Lure it the whole way across
    the map to the upper sea above the Silo — right where your sonar zooms in, under the big surface cluster.
    Treat only appears once Trick arrives there. Clearing out the larger surface fish first makes the
    trip a lot less chaotic.
  shared_gear:
  - icon: 🪱
    text: Medium bait
    required: true
  - icon: 🪝
    text: Flick attachment
  - icon: 📅
    text: Date set to Oct 31, 12:00 AM
    required: true
  path:
    points:
    - - 400
      - 25
    - - 480
      - 45
    - - 560
      - 35
    - - 630
      - 25
    - - 695
      - 20
    start_gap: 11
    end_gap: 11
