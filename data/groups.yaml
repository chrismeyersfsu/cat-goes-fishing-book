- id: a_mamo_and_the_dragon
  title: Mamo & the Dragon
  tier: A
  layout: duo
  subtitle: Large & Huge Mix · Egg Mechanic Pair
  badges:
  - text: Mixed
    kind: cat
  - text: Hard
    kind: diff-hard
  cast: Work the Dragon Area with sonar switched off — the whole egg trade happens between the open water
    and Mamo's den just below it.
  view_box: 480 0 200 251
  map_caption: Dragon Area — dashed lure path down — Mamo's Den
  map_alt: Map slice of the Dragon Area showing the path down into Mamo's den just below it
  about: Mamo guards a single egg in a den just beneath the Dragon's usual spot, snapping any baited line
    that enters. The Dragon can only be hooked using that same egg. Catching either fish means walking
    through both halves of the trick.
  special_instructions: Disable every sonar ability first — the Dragon is sensitive and bolts if it's
    pinged. Get its attention with any bait on your hook (no need to hook it) and lead it down into Mamo's
    den, keeping it just out of striking range; this scares Mamo to the far wall so you can pick up the
    egg. Lure the Dragon back out into the open the same careful way, then use the egg — no separate bait
    needed — to land the Dragon itself. Head back into the now-empty den afterward and catch the visibly
    grieving Mamo normally with large bait.
  shared_gear:
  - icon: 📍
    text: Sonar disabled
    required: true
  - icon: 🪱
    text: Any bait, to lure the Dragon
    required: true
  - icon: 🪝
    text: Mega hook, for the Dragon/egg catch
    required: true
  - icon: 🪱
    text: Large bait, for Mamo afterward
  path:
