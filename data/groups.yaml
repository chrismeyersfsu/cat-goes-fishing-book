  cast: Head to the far-right Labyrinth entrance, right where the Tech boat's reach runs out.
  view_box: 1250 0 250 251
  map_caption: Labyrinth far-right entrance — Tart above Lindfin's hat
  map_alt: Map slice of the Labyrinth's far-right entrance showing Tart guarding Lindfin
  about: Tart guards Lindfin fiercely and snaps your line on sight if you go for its ward first. Catch
    Tart, then use a hidden hat on the rockbed below to finally hook Lindfin.
  special_instructions: Catch Tart first with large bait, flicking your line near it so it lunges — skip
    this and it will snap your line the moment you hook Lindfin. With Tart gone, switch to medium bait
    and hold it near the cat-ears hat resting on the rockbed just below Lindfin. You don't need to hook
    the hat itself, just keep your bait in its vicinity, and Lindfin should take it — the hat is yours
    to collect afterward.
  shared_gear:
