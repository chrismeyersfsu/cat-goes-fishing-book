- key: bombig
  name: Bombig
  size: large
  coords:
  - - 1400
    - 70
  pin_dy: 16
  about: An oversized cousin of the off-shore Bombats, parked stationary in the Labyrinth's upper reaches.
    It inhales fish off your line without ever hooking itself — feeding it a huge-hooked Lil' Cheesefin,
    or just feeding it small fish until the area's cleared out, has both worked.
  stats:
  - icon: 🪝
    label: Gear
    value: Huge hook
  - icon: 🐟
    value: Feed it small fish or a Lil' Cheesefin
