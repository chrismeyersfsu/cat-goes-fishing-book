- key: bulbfish
  name: Bulbfish
  size: small
  coords:
  - - 285
    - 207
  pin_dy: 16
  about: Glows enough to spot easily in the darker, deep water it schools through in a loose line. The
    long haul back up is the hard part — Flick and a couple of reel upgrades cut down on losing one before
    it's in the boat. Catching one intact unlocks the lightbulb lure, and it's the key bait for hooking
    The Maw.
  stats:
