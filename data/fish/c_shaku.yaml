- key: shaku
  name: Shaku
  size: huge
  coords: [[610, 205]]
  about: >-
    A shark that spawns asleep on the Dragon Area's sea floor, past
    the cave mouth just beyond The Empty, and only on certain dates.
    Its aggressive-looking false eye is a decoy — the real one, pale
    blue, only opens once you've swum down and woken it.
