- key: babysizzer
  name: Baby Sizzer
  size: small
  coords:
  - - 100
    - 140
  pin_dy: 16
  about: Swarms around the stationary adult Sizzer, and going after one risks the parent snapping your
    line. A fast reel (or a Gauge to speed one up), plus Bait Guard and large bait to occupy the adult
    first, keeps things civil enough to pick off a baby.
  stats:
