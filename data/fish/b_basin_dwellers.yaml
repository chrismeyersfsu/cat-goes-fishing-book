- key: skrimp
  name: Skrimp
  size: small
  coords:
  - - 287
    - 140
  pin_dy: 16
  about: A tiny shrimp-like fish holding along the sea-floor drop-off just before the Basin. Work backward
    from the Reef wall toward shore, and if Gupper starts turning up, you've gone too deep — reel up to
    find the drop-off instead.
  stats:
  - icon: 🪱
    label: Bait
    value: Small
  - icon: 💣
    value: Bombs make reaching the drop-off a lot easier
- key: puff
  name: Puff
  size: small
  coords:
  - - 295
    - 90
  pin_dy: 16
  about: A small pufferfish scattered through the mid-ocean band before the Reef wall, level with its top
    and just above the Basin. No fish ever bites a Puff, so there's nothing to lose it to — once it's
    hooked it just puffs up. Its real job is live bait for Swordfish.
  stats:
  - icon: 🐟
    value: Never gets bitten by other fish
  - icon: 🔗
    value: Live bait for Swordfish
- key: gupper
  name: Gupper
  size: large
  coords:
  - - 300
    - 205
  pin_dy: 16
  about: A plump, cherry-pink fish found in the Basin just under the drop-off on the left. Lure it out
    into the open basin first, or it'll snag your line on the cave ceiling above it.
  stats:
  - icon: 🪱
    label: Bait
    value: Large
  - icon: 🎣
    value: Lure into open water before hooking
- key: gorbon
  name: Gorbon
  size: large
  coords:
  - - 345
    - 222
  pin_dy: -16
  about: A yellow-green striped fish that hangs near the Yin in the Basin, hugging the rock's upper lip
    just beneath it. Hug the right-hand cave wall by the Yin without wandering into any caves and you'll
    turn one up.
  stats:
  - icon: 🪱
    label: Bait
    value: Large
  - icon: 📍
    value: Upper lip of the rock beneath the Yin
