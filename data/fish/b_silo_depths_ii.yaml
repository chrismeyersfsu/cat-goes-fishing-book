  stats:
    - { icon: "🪱", label: "Bait", value: "Large" }
    - { icon: "📍", value: "Just above the Silo's door" }

- key: lampis
  name: Lampis
  size: large
  coords: [[750, 205]]
  pin_dy: 16
  about: >-
    One of the odder catches — a loose, ooze-like body dotted with large
