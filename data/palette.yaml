# The index's per-size pill styles. (Marker colors used to cycle
# through a 7-color palette per group; dropped in favor of a single
# fixed red -- models.MARKER_COLOR -- with numbered pins doing the
# disambiguation instead. See layout.py's docstring.)
size_pills:
  small: { background: "#d9f5d4", color: "#1f5c2c" }
  medium: { background: "#eddcb3", color: "#7a5a12" }
  large: { background: "#cfe0ee", color: "#1d3d5c" }
  huge: { background: "#12496b", color: "#ffffff" }
  secret: { background: "#e3d6f2", color: "#4a2a6b" }
