[project]
name = "fishguide-wiki"
version = "0.1.0"
description = "Fetches fish artwork from the Cat Goes Fishing wiki"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
fishwiki = "fishguide_wiki.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishguide_wiki"]
