[project]
name = "fishguide"
version = "0.1.0"
description = "Field guide build engine for Cat Goes Fishing"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1", "pyyaml>=6", "playwright>=1.62,<2", "pillow>=10"]

[project.scripts]
fishguide = "fishguide.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishguide"]
